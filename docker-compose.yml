services:
  postgres:
    image: postgres:17
    container_name: everyday-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: everyday
    ports:
      - "5432:5432"
    volumes:
      - ./.pgdata:/var/lib/postgresql/data

  adminer:
    image: adminer
    container_name: everyday-adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres
